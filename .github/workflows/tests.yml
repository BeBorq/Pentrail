name: Offline tests

# Runs the test suites only. Nothing is built for release, signed, tagged or
# published by this workflow.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.build }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        build: [sqlcipher, plain]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CGO_ENABLED: "1"
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Tool versions
        shell: bash
        run: |
          go version
          node --version
          gcc --version | head -n 1
      - name: Download modules
        run: go mod download
      - name: Vet
        shell: bash
        run: |
          tags=""
          if [ "${{ matrix.build }}" = "sqlcipher" ]; then tags="-tags sqlcipher"; fi
          go vet $tags ./...
      - name: Test
        shell: bash
        run: |
          tags=""
          if [ "${{ matrix.build }}" = "sqlcipher" ]; then tags="-tags sqlcipher"; fi
          go test $tags -count=1 -timeout=30m ./...

  checks:
    name: format and cross-platform compile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.3"
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod verify
        run: go mod verify
      - name: Windows compile check from Linux
        # type-checks the Windows code paths; the SQLCipher driver needs CGO
        # and is covered by the native Windows job
        run: GOOS=windows CGO_ENABLED=0 go vet ./...
      - name: Release script tests
        run: python3 release/test_build_release.py
